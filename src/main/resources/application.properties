
spring.application.name=hospital-records
server.port=${PORT:8080}

# Default database: in-memory H2
spring.datasource.url=jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Database Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Maximum pagination size
spring.data.web.pageable.max-page-size=50

# JWT configuration
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-1234567890}
app.jwt.expiration-minutes=60

# First administrator account
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@hospital.test}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@12345}
app.bootstrap.admin-name=System Administrator

# Demo data configuration
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.demo-password=Password@123
